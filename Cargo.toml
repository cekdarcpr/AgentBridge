[workspace]
resolver = "2"
members = ["crates/agentbridge-core", "crates/agentbridge-cli"]

[workspace.package]
version = "0.2.0"
edition = "2021"

[workspace.dependencies]
agentbridge-core = { path = "crates/agentbridge-core" }
base64 = "0.22"
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
directories = "5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "ico"] }
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service", "crypto-rust"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
